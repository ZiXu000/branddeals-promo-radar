# ILANG
# TYPE: workflow | ROLE: daily-refresh | PROJECT: branddeals-promo-radar
# ::STATE{@CI, name:travel-refresh, cron:每天 01:00 UTC (=北京时间 09:00), site:traveldeals-promo-radar.pages.dev}
# ::RULE{刷新频率等于每天一次⇒不是每几小时 页上的承诺必须跟这个频率一致}
# ::RULE{过期闸门只在管线重跑那一刻生效⇒没有按天刷新 这道闸门等于摆设}
# ::RULE{刷新失败 或某一家的抓取结果是空⇒必须留痕 让运行的人看得见 不许静默跳过}
# ::RULE{build 失败就不许部署⇒wrangler 在内容没变时会显示 Uploaded 0 files + success, 那是假成功}
# ::BOUNDARY{never:把抓不到写成没有优惠|scope:permanent}
#
# 为什么现在挂在 CI 上: 2026-09-13 用 travel-egress-test 实测过 GitHub runner 的出口,
# 四家(Southwest/Carnival/Hilton/JetBlue)全部抓到, blocked=0 —— runner 的出口没有被这些站封。
# 按老板的判据"不封就把刷新挪上去", 每日刷新从本机定时任务挪到这里, 站才是真自动
# (不再依赖某台机器开着)。
# 为什么不用 GitHub 自带的 cron（2026-09-14 实测后撤掉）:
#   这个仓库的 cron 实测不可靠 —— 仓库建后 18.6 小时里, update.yml 的 6 小时 cron 只跑了 1 次
#   (迟到 2.6h), 本工作流的每日 slot 过了 3h 还没跑。所以改成"本机可靠触发":
#   这台常开的云主机(CVM)用 Windows 计划任务到点调 GitHub API 触发本工作流
#   (tools/dispatch_travel_refresh.ps1)。抓取/构建/部署仍旧在 runner 上跑。
#   撤掉 cron 还有一个原因: 页面承诺写的是 "once a day", 若 cron 和本机触发都生效就会跑两次,
#   跟页面承诺不符。现在严格每天一次。
name: travel-refresh

on:
  workflow_dispatch: {}          # 只由本机可靠触发器调用（也可手动）

permissions:
  contents: write

concurrency:
  group: travel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # scraper.py 在 Linux 上会把这个 fallback 拼成字面的 "~/ms-playwright",
      # CI 里必须显式指到 playwright 真正装浏览器的位置, 否则渲染器找不到 chromium。
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install playwright + chromium
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Scrape travel4
        run: python scraper.py --config .ilang/travel4.ilang --out data/travel4.json

      - name: Per-brand check（0 条或非 ok 必须看得见，不许静默跳过）
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('data/travel4.json', encoding='utf-8'))
          bad = 0
          for p in d['providers']:
              n = len(p.get('items', []))
              st = p.get('status')
              flag = ""
              if n == 0 or st != 'ok':
                  flag = " <-- 0 条/非 ok，需要人工看一眼"
                  bad = 1
              print("%-22s %-8s items=%-4d expired_cut=%-3d %s%s" % (
                  p['name'], st, n, p.get('expired_dropped', 0),
                  (p.get('note') or '')[:70], flag))
          print("total:", d['stats']['items'],
                "blocked:", d['stats']['blocked'],
                "expired_dropped:", d['stats'].get('expired_dropped'))
          sys.exit(1 if bad else 0)
          PY

      - name: Build travel site
        run: python build.py --data data/travel4.json --config .ilang/travel4.ilang --out site_travel

      # 上一步 build 失败时，GitHub 的 bash -e 会直接中断 job，后面的部署不会跑 ——
      # 这正是我们要的：build 失败绝不部署（否则等于把旧/过期内容再传一遍，假成功）。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 未配置，跳过部署（抓取与提交已完成）"
            exit 0
          fi
          npx wrangler@4 pages deploy site_travel \
            --project-name traveldeals-promo-radar \
            --branch main --commit-dirty=true

      - name: Verify production（打不开就不算上线）
        run: |
          rc=0
          for u in "" "provider/southwest-airlines.html" "provider/carnival-cruise-line.html" \
                   "provider/hilton.html" "provider/jetblue.html"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 \
                   "https://traveldeals-promo-radar.pages.dev/$u")
            echo "$code  /$u"
            [ "$code" = "200" ] || rc=1
          done
          exit $rc

      - name: Commit fresh data snapshot
        run: |
          git config user.name  "branddeals-bot"
          git config user.email "branddeals-bot@users.noreply.github.com"
          git add data/travel4.json
          if git diff --staged --quiet; then
            echo "no changes this run"
            exit 0
          fi
          git commit -m "chore(travel): refresh travel4 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 远程可能被别处(API 提交等)推进过 -> non-fast-forward。先 rebase 再推, 重试 3 次。
          # 仍失败只告警不判整个 run 失败: 部署已经完成, 审计快照晚一点进远程不影响线上。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "snapshot pushed (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s ..."
            sleep 5
          done
          echo "::warning::snapshot push failed after 3 attempts (deploy already done)"
