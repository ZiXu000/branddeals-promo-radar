# ILANG
# TYPE: workflow | ROLE: daily-refresh | PROJECT: branddeals-promo-radar
# ::STATE{@CI, name:travel-refresh, trigger:本机计划任务每天 09:10 调 API 触发, site:traveldeals-promo-radar.pages.dev}
# ::RULE{刷新频率等于每天一次⇒不是每几小时 页上的承诺必须跟这个频率一致}
# ::RULE{过期闸门只在管线重跑那一刻生效⇒没有按天刷新 这道闸门等于摆设}
# ::RULE{运行记录⇒写进固定路径的带日期文件 logs/travel-<日期>.log 全成功/有失败/某家0条 三种都写}
# ::RULE{某一家抓到 0 条 或那一家请求失败⇒当天记录里必须有显式的一行 点出是哪一家 不许静默跳过}
# ::RULE{本次总条数比上一次成功少一半以上⇒视为这次没抓成 不部署 线上留旧快照 留痕}
# ::RULE{判据是条数不是流程状态⇒run 绿只说明流程跑完 不说明抓到了东西}
# ::RULE{build 失败就不许部署⇒wrangler 在内容没变时会显示 Uploaded 0 files + success, 那是假成功}
# ::BOUNDARY{never:把抓不到写成没有优惠|scope:permanent}
# ::BOUNDARY{never:用上一次的快照冒充今天刷新过|scope:permanent}
#
# 抓取/构建/部署在 GitHub runner 上跑; 触发由本机常开云主机的计划任务负责
# (tools/dispatch_travel_refresh.ps1, 每天 09:10) —— 因为 GitHub 自带 cron 实测不可靠:
# 仓库建后 18.6 小时里 6 小时一次的 cron 只跑了 1 次(迟到 2.6h), 每日 slot 过了 3h 还没跑。
# 撤掉 cron 还避免与本机触发重复跑, 跟页面承诺的 "once a day" 对齐。
name: travel-refresh

on:
  workflow_dispatch: {}          # 只由本机可靠触发器调用（也可手动）

permissions:
  contents: write

concurrency:
  # 与 update.yml 共用同一个组: 两条线都要往同一个仓库 push, 并发跑必然 rebase 冲突
  # (2026-09-14 踩过: 两条线同时触发 -> pull --rebase 冲突 -> 整步失败)。
  group: repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # scraper.py 在 Linux 上会把这个 fallback 拼成字面的 "~/ms-playwright",
      # CI 里必须显式指到 playwright 真正装浏览器的位置, 否则渲染器找不到 chromium。
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install playwright + chromium
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Scrape travel4
        run: python scraper.py --config .ilang/travel4.ilang --out data/travel4.json

      # 写当天运行记录 + 判健康。三种状态都写进 logs/travel-<日期>.log:
      #   ALL_OK / EMPTY_BRAND(某家0条或失败, 点名) / SHRINK_GUARD(总条数不足上次成功一半)
      # 不健康时这一步退出码 1 -> 后面的 build/deploy 全部跳过, 线上留旧快照。
      - name: Write run record + health verdict
        run: |
          DATE=$(date -u +%F)
          python tools/run_record.py record \
            data/travel4.json data/travel4.baseline.json \
            logs/travel-$DATE.log travel4 | tee /tmp/rec.txt
          rc=${PIPESTATUS[0]}
          # 把这段记录写进 run 页面的 Job Summary —— 这是"今天跑过"最可靠的外部信号:
          # 即使后面记录没推上仓库, 这一页也留得下(见 RULE: 跑过而记录没上去 与 今天没跑 必须分得开)。
          {
            echo "## travel-refresh $DATE"
            echo ""
            echo '```'
            cat /tmp/rec.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Build travel site
        run: python build.py --data data/travel4.json --config .ilang/travel4.ilang --out site_travel

      # build 失败时 GitHub 的 bash -e 会直接中断 job, 部署不会跑 —— 这是要的:
      # build 失败绝不部署(否则等于把旧/过期内容再传一遍, 假成功)。
      # 输出 deployed=yes/no: 下面的"记基线"只认 yes。
      # 缺 token 时旧写法是 exit 0 —— 那样 Verify 会对着"上一次的线上内容"判 200 通过,
      # 基线就被一次根本没部署的运行覆盖了(闸会因此慢慢失效)。现在这种情形明确记 deployed=no。
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deployed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN 未配置，跳过部署 —— 本次不更新基线"
            echo "- **本次未部署**（缺 CLOUDFLARE_API_TOKEN）：线上留旧快照，基线不更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler@4 pages deploy site_travel \
            --project-name traveldeals-promo-radar \
            --branch main --commit-dirty=true
          echo "deployed=yes" >> "$GITHUB_OUTPUT"

      - name: Verify production（打不开就不算上线）
        run: |
          rc=0
          for u in "" "provider/southwest-airlines.html" "provider/carnival-cruise-line.html" \
                   "provider/hilton.html" "provider/jetblue.html"; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 \
                   "https://traveldeals-promo-radar.pages.dev/$u")
            echo "$code  /$u"
            [ "$code" = "200" ] || rc=1
          done
          exit $rc

      # ::RULE{没部署的那次⇒当天那段记录里显式写一行 我从外面一拉就看得见 不许让它在外面长得跟跑完一样}
      # ::RULE{基线只在上一次判为通过之后更新⇒未部署的那一次一个字都不许写进基线}
      # 收尾一次搞定: 把"这次到底部署没部署"写进当天记录 -> 只有真部署了才更新基线 -> 一起提交。
      # if: always(): 健康判定没过 / build 失败 / 缺 token 时这一步照样跑, 所以"没部署"
      # 这件事一定会在记录里留下显式一行, 不会从外面看起来跟跑完一样。
      - name: 收尾（部署结果写进记录 + 记基线 + 提交）
        if: always()
        continue-on-error: true
        run: |
          DATE=$(date -u +%F)
          DEP="${{ steps.deploy.outputs.deployed }}"
          if [ "$DEP" = "yes" ]; then
            echo "deployed: yes —— wrangler 已执行并成功，线上已更新" >> "logs/travel-$DATE.log"
            echo "- 本次已部署（线上已更新）" >> "$GITHUB_STEP_SUMMARY"
            python tools/run_record.py baseline data/travel4.json data/travel4.baseline.json
            echo "- 基线已更新（本次健康且已部署）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployed: NO —— 本次没有部署，线上仍是旧快照；基线不更新（原因见本段上文：健康判定未过 / build 失败 / 缺 token 之一）" >> "logs/travel-$DATE.log"
            echo "- **本次没有部署**（线上仍是旧快照，基线不更新）" >> "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name  "branddeals-bot"
          git config user.email "branddeals-bot@users.noreply.github.com"
          add_all() {
            git add -f logs/ data/travel4.json
            if [ -f data/travel4.baseline.json ]; then git add -f data/travel4.baseline.json; fi
            if [ -f data/travel4.state.json ]; then git add -f data/travel4.state.json; fi
          }
          add_all
          if git diff --staged --quiet; then
            echo "no changes this run"
            echo "- 记录已在仓库（本次无新增内容）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in 1 2 3; do
            git fetch -q origin main
            # 必须是 --mixed(索引对齐 origin/main, 工作区不动)。
            # --soft 只挪 HEAD 不动索引, 于是新提交的树还是"checkout 时那个旧提交"的树,
            # 会把 origin/main 上别人新加的文件当成删除 —— 踩过, 见 2026-09-14 记录。
            git reset --mixed origin/main
            add_all
            git commit -q -m "chore(travel): run $DATE deployed=$DEP" || true
            if git push -q; then
              echo "pushed (attempt $i)"
              echo "- 记录已提交到仓库 logs/travel-$DATE.log" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s ..."
            sleep 5
          done
          echo "::warning::push failed after 3 attempts"
          echo "- **记录没有推上仓库**：今天跑过了，但仓库里看不到 logs/travel-$DATE.log 这段（run 的 artifact 里仍有）" >> "$GITHUB_STEP_SUMMARY"

      # 记录上传为 artifact —— "今天跑过"最硬的证据: 不依赖 git, 且能从 Actions API 查到。
      # 放在最后, 这样 artifact 里是含 "deployed: yes/NO" 那一行的完整记录。
      - name: Upload run record as artifact（跑过的硬证据，与 git 无关）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record
          path: logs/
          retention-days: 30
