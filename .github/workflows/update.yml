# ILANG
# TYPE: workflow | ROLE: scheduler | PROJECT: branddeals-promo-radar
# ::STATE{@CI, job1:update, runs:scraper.py+run_record+build.py, every:6h, commits:data/offers.json+site/+logs/, secrets:none}
# ::STATE{@CI, job2:deploy, runs:wrangler pages deploy, needs:update, secrets:CLOUDFLARE_API_TOKEN+CLOUDFLARE_ACCOUNT_ID}
# ::RULE{运行时零推理 零API密钥 纯 Python ⇒ update 这个 job 一个 secret 都不要}
# ::RULE{只有 deploy 这个 job 拿 Cloudflare 令牌 两个 job 靠 artifact 传 site/}
# ::RULE{没有 Cloudflare secret 时 deploy 自动跳过 update 照常跑 站不会因此停更}
# ::RULE{运行记录⇒写进固定路径的带日期文件 logs/consumer-<日期>.log 全成功/有失败/某家0条 三种都写}
# ::RULE{某家"上次抓到过、这次变 0/失败"⇒当天记录必须有显式一行点名 不许静默跳过}
# ::RULE{本次总条数比上一次成功少一半以上⇒视为这次没抓成 不部署 线上留旧快照 留痕}
# ::RULE{判据是条数不是流程状态⇒run 绿只说明流程跑完 不说明抓到了东西}
# ::RULE{同一个坑按类核⇒与旅行站 travel-refresh.yml 用同一套判据(tools/run_record.py)}
# ::BOUNDARY{never:编数据 刷量|scope:file}
# ::BOUNDARY{never:把 CLOUDFLARE_API_TOKEN 写进仓库任何文件 只走 GitHub Secrets|scope:file}
# ::BOUNDARY{never:把抓不到写成没有优惠|scope:permanent}
name: update

on:
  schedule:
    # 每 6 小时一次。优惠站卖的就是及时度，谁先挂上新优惠谁赢。
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper.py"
      - "build.py"
      - "tools/run_record.py"
      - "templates/**"
      - ".ilang/site.ilang"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  # 与 travel-refresh 共用同一个组: 两条线都要往同一个仓库 push, 并发跑必然 rebase 冲突
  # (2026-09-14 踩过: update 与 travel-refresh 同时触发 -> pull --rebase 冲突 -> 整步失败)。
  group: repo-write
  cancel-in-progress: false

jobs:
  # ---------- job 1: 抓 + 记 + 建 + 提交。零 secret。 ----------
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 要 git push，必须用能写回仓库的凭据
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public feeds
        run: python scraper.py

      # 写当天运行记录 + 判健康。三种状态都写进 logs/consumer-<日期>.log:
      #   ALL_OK / BRAND_REGRESSION(某家上次有条这次0条或失败, 点名) / SHRINK_GUARD(总条数不足上次一半)
      # 不健康时退出码 1 -> 后面的 build/commit/deploy 全部跳过, 线上留旧快照。
      # 注意: 消费站里有几家是长期被源站拒的(403/404), 它们常年 0 条 —— 判据是"回归"
      # 而不是"只要 0 条就报", 否则这个站会被永久冻住。
      - name: Write run record + health verdict
        run: |
          DATE=$(date -u +%F)
          python tools/run_record.py record \
            data/offers.json data/offers.baseline.json \
            logs/consumer-$DATE.log consumer | tee /tmp/rec.txt
          rc=${PIPESTATUS[0]}
          # 写进 run 页面的 Job Summary —— "今天跑过"最可靠的外部信号:
          # 即使后面记录没推上仓库, 这一页也留得下(跑过而记录没上去 与 今天没跑 必须分得开)。
          {
            echo "## consumer run $DATE"
            echo ""
            echo '```'
            cat /tmp/rec.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # 把当天记录作为 run artifact 上传 —— "今天跑过"最硬的证据: 不依赖 git,
      # 且能从 Actions API 直接查到(所以"跑过但记录没推上去"与"今天没跑"分得开)。
      - name: Upload run record as artifact（跑过的硬证据，与 git 无关）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record
          path: logs/
          retention-days: 30

      # 无论上一步成败都要把记录提交上去 —— 失败留痕不能只留在 runner 的临时日志里。
      # continue-on-error: 记录推不上去是"留痕"这一步的问题, 不该把整条线判死
      # (站点更新才是主线; 记录没推上去会在 run 里留 ::warning:: 与橙色步骤)。
      # git add -f: 防 .gitignore 里 logs 被忽略时这一步直接 abort(踩过, 见 2026-09-14 记录)。
      - name: Commit run record（成败都留痕）
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "branddeals-bot"
          git config user.email "branddeals-bot@users.noreply.github.com"
          git add -f logs/
          if git diff --staged --quiet; then
            echo "记录无变化"
            echo "- 记录已在仓库（本次无新增内容）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 用 fetch + reset --soft 把改动"重放"到最新远程之上 —— 不走 rebase 就不会撞冲突
          # (2026-09-14 踩过: 并发跑时 pull --rebase 冲突, 整步失败)。
          for i in 1 2 3; do
            git fetch -q origin main
            git reset --soft origin/main
            git add -f logs/
            git commit -q -m "chore: run record $(date -u +%F)" || true
            if git push -q; then
              echo "run record pushed (attempt $i)"
              echo "- 记录已提交到仓库 logs/consumer-$(date -u +%F).log" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s ..."
            sleep 5
          done
          echo "::warning::run record push failed after 3 attempts"
          echo "- **记录没有推上仓库**：今天跑过了，但仓库里看不到 logs/consumer-$(date -u +%F).log 这段" >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        env:
          # 留空时 build.py 自动回落到 .ilang/site.ilang 里的 domain
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python build.py

      # 这里只提交数据与站点; 基线的更新挪到 job 2 部署成功之后(见文件末尾) ——
      # 基线是下限闸/回归闸的对照, 绝不能被一次没部署的运行覆盖。
      - name: Commit fresh data + site
        run: |
          git config user.name  "branddeals-bot"
          git config user.email "branddeals-bot@users.noreply.github.com"
          git add data/offers.json site
          if git diff --staged --quiet; then
            echo "no changes this run"
            exit 0
          fi
          for i in 1 2 3; do
            git fetch -q origin main
            git reset --soft origin/main
            git add data/offers.json site
            git commit -q -m "chore: auto-update offers $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            if git push -q; then
              echo "snapshot pushed (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s ..."
            sleep 5
          done
          echo "::warning::push failed after 3 attempts"

      - name: Hand site/ to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  # ---------- job 2: 部署到 Cloudflare Pages。只这里拿令牌。 ----------
  # 注意：job 级 if 里 secrets 和 env 两个上下文都不可用（GitHub 会直接
  # 报 "Unrecognized named-value: 'secrets'"）。所以这里不加 if，
  # 改成在 step 里用 shell 判空：没有令牌就跳过部署，前面的抓取提交不受影响。
  deploy:
    needs: update
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get site/ from the update job
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # 把 job 1 上传的当天记录取回来 —— 即使 job 1 的记录没推上仓库,
      # 这里追加的 "deployed:" 那行也是接在同一段记录后面, 不会变成孤零零一行。
      - name: Get run record from the update job
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: run-record
          path: logs

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deployed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN 未配置，跳过部署 —— 本次不更新基线"
            echo "- **本次未部署**（缺 CLOUDFLARE_API_TOKEN）：线上留旧快照，基线不更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler@4 pages deploy site \
            --project-name branddeals-promo-radar \
            --branch main \
            --commit-dirty=true
          echo "deployed=yes" >> "$GITHUB_OUTPUT"

      # ::RULE{没部署的那次⇒当天那段记录里显式写一行 我从外面一拉就看得见 不许让它在外面看起来跟跑完一样}
      # ::RULE{基线只在上一次判为通过之后更新⇒未部署的那一次一个字都不许写进基线}
      # 收尾一次搞定: 把"这次到底部署没部署"写进当天记录 -> 只有真部署了才更新基线 -> 一起提交。
      # if: always(): 部署失败/被跳过时这一步照样跑, 所以"没部署"一定会在记录里留显式一行。
      - name: 收尾（部署结果写进记录 + 记基线 + 提交）
        if: always()
        continue-on-error: true
        run: |
          DATE=$(date -u +%F)
          DEP="${{ steps.deploy.outputs.deployed }}"
          if [ "$DEP" = "yes" ]; then
            echo "deployed: yes —— wrangler 已执行并成功，线上已更新" >> "logs/consumer-$DATE.log"
            echo "- 本次已部署（线上已更新）" >> "$GITHUB_STEP_SUMMARY"
            python tools/run_record.py baseline data/offers.json data/offers.baseline.json
            echo "- 基线已更新（本次健康且已部署）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployed: NO —— 本次没有部署，线上仍是旧快照；基线不更新（原因见本段上文：健康判定未过 / build 失败 / 缺 token 之一）" >> "logs/consumer-$DATE.log"
            echo "- **本次没有部署**（线上仍是旧快照，基线不更新）" >> "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name  "branddeals-bot"
          git config user.email "branddeals-bot@users.noreply.github.com"
          add_all() {
            git add -f logs/
            if [ -f data/offers.baseline.json ]; then git add -f data/offers.baseline.json; fi
            if [ -f data/offers.state.json ]; then git add -f data/offers.state.json; fi
          }
          add_all
          if git diff --staged --quiet; then
            echo "no changes"
            echo "- 记录已在仓库（本次无新增内容）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in 1 2 3; do
            git fetch -q origin main
            git reset --soft origin/main
            add_all
            git commit -q -m "chore: consumer run $DATE deployed=$DEP" || true
            if git push -q; then
              echo "pushed (attempt $i)"
              echo "- 记录已提交到仓库 logs/consumer-$DATE.log" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push attempt $i failed, retrying in 5s ..."
            sleep 5
          done
          echo "::warning::push failed after 3 attempts"
          echo "- **记录没有推上仓库**：今天跑过了，但仓库里看不到 logs/consumer-$DATE.log 这段（run 的 artifact 里仍有）" >> "$GITHUB_STEP_SUMMARY"
